schema_version = "1.0.0"

id = "mixtli"
name = "Mixtli"
tagline = "Generate, analyse and visualise point clouds"
version = "1.6.0"
type = "add-on"

maintainer = "Luis Pacheco <luigipach@gmail.com>"
website = "https://github.com/luigipacheco/mixtli"

tags = ["Geometry Nodes", "Import-Export", "Object"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 Luis Pacheco",
]

# Pure Python + Blender's bundled numpy. No bundled wheels. The network is
# only used when the user clicks Get GIS Data with an online source, and only
# with Blender's Allow Online Access on; files only at paths the user chooses.
[permissions]
files = "Export PLY, read and save GeoJSON files chosen by the user"
network = "Download OpenStreetMap or OGC API features for a cloud area"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.gitignore",
  "/docs/",
  "/dist/",
  "/*.zip",
]
